services:

  # ─────────────────────────────────────────────
  # Vaultwarden — runs in both local and prod
  # ─────────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBSOCKET_ENABLED: "true"
      SHOW_PASSWORD_HINTS: "false"
      # Write logs to a file so fail2ban can read them
      LOG_FILE: /data/vaultwarden.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vw-data:/data
    networks:
      - vw-internal
    expose:
      - "80"
    healthcheck:
      # vaultwarden/server is Debian-slim — use wget, not curl
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Grocy — household / grocery management
  # Runs in caddy profile alongside Vaultwarden.
  # Data stored in grocy-data volume at /config.
  # Accessible at GROCY_DOMAIN (see .env).
  # ─────────────────────────────────────────────
  grocy:
    profiles: ["caddy"]
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
    volumes:
      - grocy-data:/config
    networks:
      - vw-internal
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────
  # CouchDB — backend for Obsidian Self-hosted LiveSync.
  # Runs in caddy profile alongside Vaultwarden/Grocy.
  # Accessible at OBSIDIAN_DOMAIN (see .env). CORS is
  # pre-configured on every start (see entrypoint below) so the
  # LiveSync plugin's "Check Database Configuration" step finds
  # everything already correct.
  #
  # cors/origins MUST list specific origins, not "*" — browsers
  # reject `Access-Control-Allow-Origin: *` combined with
  # `Access-Control-Allow-Credentials: true`, which surfaces in the
  # LiveSync plugin as "CORS is not allowing credentials":
  # https://github.com/vrtmrz/obsidian-livesync/issues/613
  # ─────────────────────────────────────────────
  couchdb:
    profiles: ["caddy"]
    image: couchdb:3.3
    container_name: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /opt/couchdb/etc/local.d/10-livesync.ini <<'EOF'
        [chttpd]
        enable_cors = true

        [httpd]
        enable_cors = true

        [cors]
        origins = app://obsidian.md, capacitor://localhost, http://localhost
        credentials = true
        methods = GET, PUT, POST, HEAD, DELETE
        headers = accept, authorization, content-type, origin, referer
        EOF
        exec /docker-entrypoint.sh /opt/couchdb/bin/couchdb
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-config:/opt/couchdb/etc/local.d
    networks:
      - vw-internal
    expose:
      - "5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # CADDY profile — Caddy provides HTTPS via:
  #   localhost        → self-signed cert (local dev)
  #   vault.kaosklan.net → automatic Let's Encrypt cert
  # Usage: docker compose --profile caddy up -d
  # ─────────────────────────────────────────────
  caddy:
    profiles: ["caddy"]
    image: caddy:alpine
    container_name: vaultwarden-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      GROCY_DOMAIN: ${GROCY_DOMAIN:-grocy.localhost}
      OBSIDIAN_DOMAIN: ${OBSIDIAN_DOMAIN:-obsidian.localhost}
      ADMIN_ALLOWED_IP: ${ADMIN_ALLOWED_IP:-127.0.0.1}
    networks:
      - vw-internal
    depends_on:
      vaultwarden:
        condition: service_started
      grocy:
        condition: service_started
      couchdb:
        condition: service_started

  # ─────────────────────────────────────────────
  # TUNNEL profile — Cloudflare Tunnel (optional)
  # No inbound ports needed on the host at all.
  # Tunnel routes traffic to vaultwarden:80
  # internally on the vw-internal network.
  # Usage: docker compose --profile tunnel up -d
  # ─────────────────────────────────────────────
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: vaultwarden-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-not-configured}
    networks:
      - vw-internal
    depends_on:
      vaultwarden:
        condition: service_started

  # ─────────────────────────────────────────────
  # PROD profile — Fail2Ban
  # Reads Vaultwarden log file and bans IPs that
  # repeatedly fail authentication.
  # Note: with Cloudflare Tunnel, bans apply at
  # the OS iptables level (blocks non-CF traffic).
  # For CF-level banning add a CF API token and
  # the cloudflare action (see fail2ban/README.md).
  # ─────────────────────────────────────────────
  fail2ban:
    profiles: ["tunnel", "caddy"]
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: vaultwarden-fail2ban
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host        # must use host network to apply iptables rules
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
    volumes:
      # /config must be writable: on first run the image seeds it with its
      # full default config set (fail2ban.conf, jail.conf, filter.d/sshd.conf,
      # action.d/*.conf, etc.) and writes its own log under /config/log.
      # A read-only mount here leaves /etc/fail2ban incomplete and the
      # server fails to start (missing actions/filters, can't open its log).
      - fail2ban-config:/config
      # Our jail/filter definitions, copied into /config/fail2ban by
      # custom-cont-init.d/10-vaultwarden-config.sh (see that file for why).
      - ./fail2ban:/our-config:ro
      - ./fail2ban/custom-cont-init.d:/custom-cont-init.d:ro
      - vw-data:/vaultwarden-data:ro           # read vaultwarden.log
      - /var/log:/var/log:ro                   # OS logs (for sshd jail)

volumes:
  vw-data:
    driver: local
  fail2ban-config:
    driver: local
  grocy-data:
    driver: local
  couchdb-data:
    driver: local
  couchdb-config:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  vw-internal:
    driver: bridge
