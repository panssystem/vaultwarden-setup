# Copy to secret.yaml (gitignored), fill in values, and apply.
# Values must be base64-encoded: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-secrets
  namespace: vaultwarden
type: Opaque
data:
  # Generate admin token: docker run --rm -it vaultwarden/server /vaultwarden hash --preset owasp
  # Then base64-encode the full $argon2id$... string
  ADMIN_TOKEN: ""   # base64-encoded argon2 hash
  # SMTP_USERNAME: ""
  # SMTP_PASSWORD: ""
